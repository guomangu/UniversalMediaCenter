server:
  siteName: MERRY Studio
  siteTagline: Le hub multimédia zéro-config out-of-the-box
  locale: fr-FR
  port: 3000
  corsOrigins:
    - "*"
  publicBaseUrl: https://cool.sweaw.com
security:
  invitationOnly: false
  invitationCodes:
    - UMS-WELCOME-2026
    - COOL-MEDIA-VIP
  allowOnTheFlyCreation: true
  defaultPasswordRequired: false
  defaultPinRequired: false
  defaultMaxCsaAge: null
ui:
  theme: dark
  defaultView: HOME
  enableHeroSpotlight: true
  enableCastModal: true
  enableSkipIntro: true
  skipIntroDurationSeconds: 85
  cardsPerRail: 15
  bannerHeight: 460
media:
  autoEnrichMetadata: true
  enrichmentBatchSize: 30
  autoReindexOnStart: true
  enableLiveTvProxy: true
  supportedVideoCodecs:
    - h264
    - hevc
    - vp9
    - av1
  globalExcludedFolders:
    - "@eaDir"
    - "#recycle"
    - .git
    - lost+found
    - /run/media/tele/My Passport/musique
    - /run/media/tele/My Passport/e-books
  defaultAudioLanguage: fra
  defaultSubtitleLanguage: fra
  subtitleMode: fallback_if_audio_missing
profiles:
  defaultRole: MEMBRE
  defaultCanDownload: true
  defaultCanTranscode: true
  defaultCanWatchIptv: true
  defaultMaxCsaAge: null
  defaultBlockedTags: []
  defaultAllowedTags: []
  defaultBlockedFolders: []
  defaultAllowedFolders: []
profileTypes:
  - id: ADMINISTRATEUR
    label: Administrateur
    description: Accès complet sans restriction, gestion de la plateforme
    isAdmin: true
    canDownload: true
    canTranscode: true
    canWatchIptv: true
    maxCsaAgeLimit: null
    allowedTags: []
    blockedTags: []
    blockedFolders: []
  - id: MEMBRE
    label: Membre Standard
    description: Accès standard à l’ensemble de la médiathèque
    isAdmin: false
    canDownload: true
    canTranscode: true
    canWatchIptv: true
    maxCsaAgeLimit: null
    allowedTags: []
    blockedTags: []
    blockedFolders: []
    allowedFolders:
      - /home/tele/Vidéos/drive/libre
  - id: ENFANT
    label: Enfant (Jeunesse)
    description: Dessins animés & famille, CSA -10, blocage violence et horreur
    isAdmin: false
    canDownload: false
    canTranscode: true
    canWatchIptv: false
    maxCsaAgeLimit: 10
    allowedTags:
      - Animation
      - Jeunesse
      - Famille
      - Kids
    blockedTags:
      - Horreur
      - "+18"
      - Gore
      - Violence
      - Thriller
    blockedFolders:
      - /Films/Horreur
      - /Films/Adultes
      - Horreur
  - id: NORMALOS
    label: normalos
    isAdmin: false
    canDownload: true
    canTranscode: true
    canWatchIptv: true
    maxCsaAgeLimit: null
    allowedTags: []
    blockedTags: []
    allowedFolders: []
    blockedFolders:
      - /run/media/tele/My Passport/musique
      - /run/media/tele/My Passport/e-books
