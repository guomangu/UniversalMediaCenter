name: universal-media-stack

services:
  # 1. Base de données PostgreSQL 16 + PostGIS + pg_trgm
  database:
    image: postgis/postgis:16-3.4-alpine
    container_name: ums_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ums}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ums_secret}
      POSTGRES_DB: ${POSTGRES_DB:-ums_db}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data:z
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ums} -d ${POSTGRES_DB:-ums_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ums_net

  # 2. Backend API Hono + Drizzle + NFO Watcher + IPTV Worker + Seeder
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ums_api
    restart: unless-stopped
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - API_PORT=${API_PORT:-3000}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-ums}:${POSTGRES_PASSWORD:-ums_secret}@database:5432/${POSTGRES_DB:-ums_db}
      - MEDIA_CHAOS_ROOT=${MEDIA_CHAOS_ROOT:-/media/chaos}
      - AUTO_SEED_KYOO_PRESET=${AUTO_SEED_KYOO_PRESET:-true}
      - AUTH_SECRET=${AUTH_SECRET:-super_secret_session_key_ums}
    volumes:
      - ./backend:/app:z
      - ./media:/media:z
      - /var/home/tele/Vidéos/drive:/home/tele/Vidéos/drive:ro,z
      - /var/home/tele/Vidéos/drive:/var/home/tele/Vidéos/drive:ro,z
    ports:
      - "${API_PORT:-3000}:${API_PORT:-3000}"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - ums_net

  # 3. Gateway Caddy (Reverse Proxy + HTTP Range)
  gateway:
    image: caddy:2-alpine
    container_name: ums_gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-8080}:80"
    volumes:
      - ./config/Caddyfile:/etc/caddy/Caddyfile:ro,z
      - ./media:/media:ro,z
      - /var/home/tele/Vidéos/drive:/home/tele/Vidéos/drive:ro,z
      - /var/home/tele/Vidéos/drive:/var/home/tele/Vidéos/drive:ro,z
    depends_on:
      - backend
    networks:
      - ums_net

networks:
  ums_net:
    driver: bridge
